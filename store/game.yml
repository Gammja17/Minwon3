tags: ["취미 및 직업 시뮬레이션", "퍼즐", "풍부한 스토리", "캐주얼", "분위기 있는"]
short: "햇살동 주민센터 신규 주무관의 첫 2주. 서류를 대조하고 도장을 쾅! 진상은 먹금, 남의 일은 알맞은 부서로."
controls: "마우스: 서류 끌기, 도장 집어서 찍기, 오른쪽 클릭으로 도장 지우기, 돋보기로 안 맞는 두 곳 누르기 / Esc: 도장 내려놓기"
ai_tools: ["Claude Code"]
dev_period: "1일"
ai_note: "코드와 기획은 Claude Code와 함께 만들었어요. 인물 초상화와 책상 소품은 VARCO(gpt-image-2.5)로 그렸고, 효과음은 Kenney의 CC0 에셋, 글꼴은 물마루와 Pretendard(OFL)를 썼어요."
engine: "Godot 4.7 (Compatibility, Web)"
